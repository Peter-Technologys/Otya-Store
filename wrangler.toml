name = "otya-store"
main = "src/queue-worker.mjs"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "petersmartlink.com", custom_domain = true },
  { pattern = "www.petersmartlink.com", custom_domain = true }
]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
APP_NAME    = "OTYA Backend"
WEBSITE_URL = "https://petersmartlink.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding     = "R2"
bucket_name = "otya-player-releases"

[[kv_namespaces]]
binding = "KV"
id      = "3f179286e0fc4dbfa2332884cdf81312"

[[d1_databases]]
binding       = "DB"
database_name = "otya-store-db"
database_id   = "ab157fc6-2cbb-4d46-9789-2e4392e16aea"

[[unsafe.bindings]]
type         = "ratelimit"
name         = "RATE_LIMITER"
namespace_id = "1001"

  [unsafe.bindings.simple]
  limit  = 60
  period = 60

[[send_email]]
name                = "EMAIL"
destination_address = "petersmartlink@gmail.com"

[[queues.producers]]
binding = "PUSH_QUEUE"
queue   = "otya-push-queue"

[[queues.consumers]]
queue             = "otya-push-queue"
max_batch_size    = 10
max_retries       = 3
dead_letter_queue = "otya-push-queue-dlq"

# Workers AI
[ai]
binding = "AI"

# AI processing queue
[[queues.producers]]
binding = "AI_QUEUE"
queue   = "otya-ai-queue"

[[queues.consumers]]
queue             = "otya-ai-queue"
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "otya-ai-queue-dlq"

# Service Binding — authentication worker (JWT verification via Service Binding)
[[services]]
binding = "AUTH"
service = "otya-auth"

# Cron triggers
[triggers]
crons = [
  "*/5 * * * *",
  "0 * * * *",
  "0 6 * * 1",
  "0 9 * * *"
]
