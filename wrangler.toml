# OTYA STORE - Main Store API
# Database for: version info, download analytics, device tracking

name = "otya-store"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
route = "api.otyaplayer.com/*"
zone_id = "YOUR_CLOUDFLARE_ZONE_ID"

# Bindings

# R2 Storage - APK files + version.json
[[r2_buckets]]
binding = "R2"
bucket_name = "otya-store-apks-prod"

# KV - Version cache + blocked IPs
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# D1 Database - Download analytics ONLY (NOT auth!)
# FIX: Use SEPARATE database ID from auth-worker
[[d1_databases]]
binding = "DB"
database_name = "otya-store-db-production"
database_id = "YOUR-UNIQUE-STORE-DB-ID"  # MUST BE DIFFERENT from auth DB

# Rate Limiter - Durable Objects
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "otya-store"

# Email Service - Send alerts
[[send_email]]
name = "EMAIL"

# Environment variables
[env.production.vars]
ADMIN_TOKEN = "USE_CLOUDFLARE_SECRETS_NOT_PLAIN_TEXT"
