name = "otya-store"
main = "src/entrypoint.mjs"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
routes = [
  { pattern = "petersmartlink.com", custom_domain = true },
  { pattern = "www.petersmartlink.com", custom_domain = true }
]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
APP_NAME    = "OTYA Backend"
WEBSITE_URL = "https://petersmartlink.com"
ADMIN_REPORT_EMAIL = "petersmartlink@gmail.com"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding     = "R2"
bucket_name = "otya-player-releases"

[[kv_namespaces]]
binding = "KV"
id      = "3f179286e0fc4dbfa2332884cdf81312"

[[d1_databases]]
binding       = "DB"
database_name = "otya-store-db"
database_id   = "ab157fc6-2cbb-4d46-9789-2e4392e16aea"

[[unsafe.bindings]]
type         = "ratelimit"
name         = "RATE_LIMITER"
namespace_id = "1001"
  [unsafe.bindings.simple]
  limit  = 60
  period = 60

# Transactional and operational email is sent through Resend using the
# dashboard-managed RESEND_API_KEY secret. No Cloudflare Send Email binding is
# required by the application runtime.

[[queues.producers]]
binding = "PUSH_QUEUE"
queue   = "otya-push-queue"
[[queues.consumers]]
queue             = "otya-push-queue"
max_batch_size    = 10
max_retries       = 3
dead_letter_queue = "otya-push-queue-dlq"

# Store/API produces AI jobs; otya-ai owns inference and AI queue consumption.
[[queues.producers]]
binding = "AI_QUEUE"
queue   = "otya-ai-queue"

[[services]]
binding = "AUTH"
service = "otya-auth"
[[services]]
binding = "AI_SUPPORT"
service = "otya-ai"

[[workflows]]
name = "otya-release-workflow"
binding = "OTYA_RELEASE_WORKFLOW"
class_name = "OtyaReleaseWorkflow"

# Analytics Engine is intentionally omitted on the Cloudflare Free deployment.
# Runtime analytics writes are optional and already no-op when the binding is
# absent, so production deployment does not need a fail-first retry.

# Only non-AI operational schedules remain here.
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]
