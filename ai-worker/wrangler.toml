name = "otya-ai"
main = "src/scheduled-entry.mjs"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 0.35
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
ENVIRONMENT = "production"
APP_NAME = "OTYA AI"
WEBSITE_URL = "https://petersmartlink.com"
ADMIN_REPORT_EMAIL = "petersmartlink@gmail.com"
ADMIN_CRASH_ALERT_THRESHOLD = "5"
TELEGRAM_BOT_USERNAME = "OtyaPlayerBot"
TELEGRAM_CHANNEL_URL = "https://t.me/otyaplayer"
# Public Ask OTYA catalog. These IDs are curated general/chat-capable Workers
# AI models verified against Cloudflare's current model catalog. Guest users
# stay on the fast low-cost model; signed-in users may choose any listed model.
AI_PUBLIC_MODELS = "llama-fast,otya-smart,gemma-4,granite,llama-70b,gpt-oss-20b,gpt-oss-120b,nemotron,llama-4-scout,qwen3,sea-lion"
AI_GUEST_MODEL = "llama-fast"
AI_DEFAULT_MODEL = "otya-smart"
OTYA_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
OTYA_REPORT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
GMAIL_GOOGLE_CLIENT_ID = "82776565585-77b1t8epvmn3mpdvstdg1rtprlju4suv.apps.googleusercontent.com"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "otya-store-db"
database_id = "ab157fc6-2cbb-4d46-9789-2e4392e16aea"

[[kv_namespaces]]
binding = "KV"
id = "3f179286e0fc4dbfa2332884cdf81312"

[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "otya-push-queue"

[[queues.consumers]]
queue = "otya-ai-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "otya-ai-queue-dlq"

[triggers]
# Hourly: lightweight admin-only exception check.
# 05:00 UTC = 08:00 Africa/Kampala: morning operations brief + churn signals.
# Monday 06:00 UTC = 09:00 Africa/Kampala: deeper weekly review.
crons = ["0 * * * *", "0 5 * * *", "0 6 * * 1"]
# Add the EXISTING production Vectorize index as binding VECTORIZE only after
# confirming its exact name in Cloudflare. Do not create a duplicate index.
# Required secrets: RESEND_API_KEY. Optional integrations: TELEGRAM_BOT_TOKEN,
# TELEGRAM_WEBHOOK_SECRET, INTERNAL_SECRET, GMAIL_GOOGLE_CLIENT_SECRET,
# CONNECTOR_ENCRYPTION_KEY. Never commit secret values.
