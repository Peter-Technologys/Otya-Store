# Otya Store - Unified Cloudflare Worker + Next.js Website
# GitLab CI: validate (next build) on MR + main
# GitLab CI: deploy to Cloudflare on push to main

image: node:22-alpine

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == "main"'

cache:
  key: "npm-$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - .next/cache/

stages:
  - validate
  - deploy

before_script:
  - npm install --silent

# Validate: next build catches TS/ESLint errors on every MR and main push
validate:
  stage: validate
  script:
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Deploy: build with OpenNext and deploy to Cloudflare Workers on main only
# Required GitLab CI/CD Variables:
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
#   CLOUDFLARE_API_KEY     - Cloudflare Global API Key
deploy:
  stage: deploy
  script:
    - npm run deploy
  environment:
    name: production
    url: https://petersmartlink.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_ACCOUNT_ID && $CLOUDFLARE_API_KEY'
  variables:
    CLOUDFLARE_EMAIL: petersmartlink@gmail.com
