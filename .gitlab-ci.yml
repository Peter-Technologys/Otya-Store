# Getotya - Unified Cloudflare Worker + Next.js Website
# GitLab CI: validate only (build check + type check)
# Deployment is handled by GitHub Actions on push to main

image: node:20-alpine

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == "main"'

cache:
  key: "npm-$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - .next/cache/

stages:
  - validate

before_script:
  - npm install --silent

# Validate: next build catches TS errors and broken imports on every push
validate:
  stage: validate
  script:
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
