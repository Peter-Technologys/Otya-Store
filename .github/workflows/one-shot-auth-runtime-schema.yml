name: One-shot auth runtime schema repair

on:
  push:
    branches: ['fix/auth-runtime-schema-readiness-2026-09-01']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/auth-runtime-schema-readiness-2026-09-01
          fetch-depth: 0
      - name: Move schema repair out of auth requests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          db_path = Path('auth-worker/src/db.ts')
          db = db_path.read_text()
          old_email = '  email                      TEXT UNIQUE NOT NULL,'
          if old_email not in db:
              raise SystemExit('expected db email definition not found')
          db = db.replace(old_email, '  email                      TEXT UNIQUE,', 1)

          marker = 'export async function ensureSchema(db: D1Database): Promise<void> {'
          if marker not in db:
              raise SystemExit('ensureSchema marker not found')
          lines = [
              'const REQUIRED_SCHEMA_READS = [',
              '  `SELECT id, otya_id, email, password_hash, google_id, name, avatar_url, is_verified,',
              '          phone_number, phone_verified_at, phone_verification_method, recovery_email,',
              '          recovery_email_verified_at, country_code, locale, timezone, created_at, updated_at',
              '   FROM users LIMIT 0`,',
              '  `SELECT user_id, product_id, status, first_seen_at, last_seen_at',
              '   FROM user_products LIMIT 0`,',
              '  `SELECT user_id, provider, provider_subject, provider_username, provider_email, linked_at, last_used_at',
              '   FROM linked_identities LIMIT 0`,',
              '] as const',
              '',
              '/** Read-only runtime readiness; DDL belongs to deployment repair. */',
              'export async function assertSchemaReady(db: D1Database): Promise<void> {',
              '  for (const query of REQUIRED_SCHEMA_READS) {',
              '    await db.prepare(query).all()',
              '  }',
              '}',
              '',
          ]
          db = db.replace(marker, '\n'.join(lines) + marker, 1)
          db_path.write_text(db)

          schema_path = Path('auth-worker/schema.sql')
          schema = schema_path.read_text()
          expected = '  id                         TEXT PRIMARY KEY,\n  email                      TEXT UNIQUE NOT NULL,'
          replacement = '  id                         TEXT PRIMARY KEY,\n  otya_id                    TEXT,\n  email                      TEXT UNIQUE,'
          if expected not in schema:
              raise SystemExit('expected canonical users schema not found')
          schema = schema.replace(expected, replacement, 1)
          if 'idx_users_otya_id' not in schema:
              schema = schema.replace(
                  'CREATE INDEX IF NOT EXISTS idx_users_google ON users(google_id);',
                  'CREATE INDEX IF NOT EXISTS idx_users_google ON users(google_id);\nCREATE UNIQUE INDEX IF NOT EXISTS idx_users_otya_id ON users(otya_id) WHERE otya_id IS NOT NULL;',
                  1,
              )
          schema_path.write_text(schema)

          repair_path = Path('auth-worker/scripts/repair-remote-schema.sh')
          repair = repair_path.read_text()
          if 'email TEXT UNIQUE NOT NULL' not in repair:
              raise SystemExit('expected remote fresh-schema definition not found')
          repair = repair.replace('email TEXT UNIQUE NOT NULL', 'email TEXT UNIQUE', 1)
          repair_path.write_text(repair)

          changed = []
          for path in sorted(Path('auth-worker/src').glob('*.ts')):
              if path.name == 'db.ts':
                  continue
              text = path.read_text()
              if 'ensureSchema' not in text:
                  continue
              text = text.replace('ensureSchema', 'assertSchemaReady')
              text = text.replace('Schema initialization failed', 'Schema readiness check failed')
              text = text.replace('schema initialization', 'schema readiness')
              path.write_text(text)
              changed.append(path.as_posix())
          if not changed:
              raise SystemExit('no runtime schema callers changed')

          contract_path = Path('test/auth-readiness-contract.test.mjs')
          contract = contract_path.read_text().replace('ensureSchema', 'assertSchemaReady')
          contract_path.write_text(contract)

          # Guard the architecture before committing.
          for path in sorted(Path('auth-worker/src').glob('*.ts')):
              if path.name != 'db.ts' and 'ensureSchema(' in path.read_text():
                  raise SystemExit(f'runtime DDL caller remains: {path}')
          db = db_path.read_text()
          start = db.index('export async function assertSchemaReady')
          end = db.index('export async function ensureSchema')
          readiness = db[start:end]
          if any(token in readiness.upper() for token in ('CREATE TABLE', 'ALTER TABLE', 'CREATE INDEX')):
              raise SystemExit('readiness helper contains DDL')
          for token in ('FROM users LIMIT 0', 'FROM user_products LIMIT 0', 'FROM linked_identities LIMIT 0'):
              if token not in db:
                  raise SystemExit(f'missing readiness probe: {token}')
          if 'email                      TEXT UNIQUE NOT NULL' in schema_path.read_text():
              raise SystemExit('canonical schema still requires email')
          if 'email TEXT UNIQUE NOT NULL' in repair_path.read_text():
              raise SystemExit('remote fresh schema still requires email')

          Path('.github/workflows/one-shot-auth-runtime-schema.yml').unlink()
          print('Updated runtime callers:', ', '.join(changed))
          PY

          node --test test/auth-readiness-contract.test.mjs

          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move auth schema repair out of request paths'
          git push origin HEAD:fix/auth-runtime-schema-readiness-2026-09-01
