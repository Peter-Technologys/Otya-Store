name: One-shot auth runtime schema repair

on:
  push:
    branches: ['fix/auth-runtime-schema-readiness-2026-09-01']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/auth-runtime-schema-readiness-2026-09-01
          fetch-depth: 0
      - name: Separate deploy-time schema repair from request-time readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          db_path = Path('auth-worker/src/db.ts')
          db = db_path.read_text()
          old_email = '  email                      TEXT UNIQUE NOT NULL,'
          if old_email not in db:
              raise SystemExit('expected db users email definition not found')
          db = db.replace(old_email, '  email                      TEXT UNIQUE,', 1)

          marker = 'export async function ensureSchema(db: D1Database): Promise<void> {'
          if marker not in db:
              raise SystemExit('ensureSchema marker not found')
          readiness = '''const REQUIRED_SCHEMA_READS = [
            `SELECT id, otya_id, email, password_hash, google_id, name, avatar_url, is_verified,
                    phone_number, phone_verified_at, phone_verification_method, recovery_email,
                    recovery_email_verified_at, country_code, locale, timezone, created_at, updated_at
             FROM users LIMIT 0`,
            `SELECT user_id, product_id, status, first_seen_at, last_seen_at
             FROM user_products LIMIT 0`,
            `SELECT user_id, provider, provider_subject, provider_username, provider_email, linked_at, last_used_at
             FROM linked_identities LIMIT 0`,
          ] as const

          /**
           * Read-only production readiness check. Schema creation and repair belong to
           * deployment (`auth-worker/scripts/repair-remote-schema.sh`), never a user
           * request. A missing table/column therefore fails closed without issuing DDL.
           */
          export async function assertSchemaReady(db: D1Database): Promise<void> {
            for (const query of REQUIRED_SCHEMA_READS) {
              await db.prepare(query).all()
            }
          }

          '''
          db = db.replace(marker, readiness + marker, 1)
          db_path.write_text(db)

          schema_path = Path('auth-worker/schema.sql')
          schema = schema_path.read_text()
          expected = '  id                         TEXT PRIMARY KEY,\n  email                      TEXT UNIQUE NOT NULL,'
          replacement = '  id                         TEXT PRIMARY KEY,\n  otya_id                    TEXT,\n  email                      TEXT UNIQUE,'
          if expected not in schema:
              raise SystemExit('expected canonical users schema not found')
          schema = schema.replace(expected, replacement, 1)
          if 'idx_users_otya_id' not in schema:
              schema = schema.replace(
                  'CREATE INDEX IF NOT EXISTS idx_users_google ON users(google_id);',
                  'CREATE INDEX IF NOT EXISTS idx_users_google ON users(google_id);\nCREATE UNIQUE INDEX IF NOT EXISTS idx_users_otya_id ON users(otya_id) WHERE otya_id IS NOT NULL;',
                  1,
              )
          schema_path.write_text(schema)

          repair_path = Path('auth-worker/scripts/repair-remote-schema.sh')
          repair = repair_path.read_text()
          if 'email TEXT UNIQUE NOT NULL' not in repair:
              raise SystemExit('expected fresh remote users definition not found')
          repair = repair.replace('email TEXT UNIQUE NOT NULL', 'email TEXT UNIQUE', 1)
          repair_path.write_text(repair)

          runtime_files = []
          for path in sorted(Path('auth-worker/src').glob('*.ts')):
              if path.name == 'db.ts':
                  continue
              text = path.read_text()
              if 'ensureSchema' not in text:
                  continue
              text = text.replace('ensureSchema', 'assertSchemaReady')
              text = text.replace('Schema initialization failed', 'Schema readiness check failed')
              text = text.replace('schema initialization', 'schema readiness')
              path.write_text(text)
              runtime_files.append(path.as_posix())

          if not runtime_files:
              raise SystemExit('no runtime ensureSchema callers were replaced')

          Path('test/auth-readiness-contract.test.mjs').write_text(r'''import test from 'node:test'
import assert from 'node:assert/strict'
import { readFileSync } from 'node:fs'

const source = readFileSync(new URL('../auth-worker/src/production-entrypoint.ts', import.meta.url), 'utf8')

test('production auth fails closed when identity schema is unavailable', () => {
  assert.match(source, /import \{ assertSchemaReady \} from '\.\/db'/)
  assert.match(source, /let identitySchemaReady: Promise<void> \| null = null/)
  assert.match(source, /identitySchemaReady = assertSchemaReady\(env\.AUTH_DB\)\.catch/)
  assert.match(source, /identitySchemaReady = null/)
  assert.match(source, /AUTH_SCHEMA_UNAVAILABLE/)
  assert.match(source, /OTYA Account is temporarily unavailable/)
  assert.match(source, /503/)
})

test('schema readiness guards only session-creating identity writes', () => {
  assert.match(source, /function createsIdentitySession\(request: Request, url: URL\)/)
  assert.match(source, /\['\/auth\/register', '\/auth\/login', '\/auth\/google'\]/)
  assert.match(source, /if \(createsIdentitySession\(request, url\)\) \{/)
})

test('security and provider handlers run before schema readiness', () => {
  const adminIndex = source.indexOf("url.pathname.startsWith('/auth/admin/')")
  const telegramIndex = source.indexOf("url.pathname.startsWith('/auth/telegram/')")
  const schemaIndex = source.indexOf('if (createsIdentitySession(request, url))')
  assert.ok(adminIndex >= 0 && adminIndex < schemaIndex)
  assert.ok(telegramIndex >= 0 && telegramIndex < schemaIndex)
})
''')

          Path('test/auth-runtime-schema-contract.test.mjs').write_text(r'''import test from 'node:test'
import assert from 'node:assert/strict'
import { readFileSync, readdirSync } from 'node:fs'

const read = path => readFileSync(new URL(`../${path}`, import.meta.url), 'utf8')

test('production auth request paths use read-only schema readiness', () => {
  const files = readdirSync(new URL('../auth-worker/src/', import.meta.url))
    .filter(name => name.endsWith('.ts') && name !== 'db.ts')
  for (const name of files) {
    const source = read(`auth-worker/src/${name}`)
    assert.doesNotMatch(source, /\bensureSchema\s*\(/, `${name} must not run schema DDL at request time`)
  }
  const db = read('auth-worker/src/db.ts')
  assert.match(db, /export async function assertSchemaReady/)
  assert.match(db, /FROM users LIMIT 0/)
  assert.match(db, /FROM user_products LIMIT 0/)
  assert.match(db, /FROM linked_identities LIMIT 0/)
  const start = db.indexOf('export async function assertSchemaReady')
  const end = db.indexOf('export async function ensureSchema')
  assert.ok(start >= 0 && end > start)
  const readiness = db.slice(start, end)
  assert.doesNotMatch(readiness, /CREATE TABLE|ALTER TABLE|CREATE INDEX/i)
})

test('fresh auth schema supports provider-only identities and public Otya IDs', () => {
  const schema = read('auth-worker/schema.sql')
  const repair = read('auth-worker/scripts/repair-remote-schema.sh')
  assert.match(schema, /otya_id\s+TEXT/)
  assert.match(schema, /email\s+TEXT UNIQUE,/)
  assert.doesNotMatch(schema, /email\s+TEXT UNIQUE NOT NULL/)
  assert.match(schema, /idx_users_otya_id/)
  assert.doesNotMatch(repair, /email TEXT UNIQUE NOT NULL/)
  assert.match(repair, /CREATE TABLE IF NOT EXISTS users/)
})
''')

          Path('.github/workflows/one-shot-auth-runtime-schema.yml').unlink()
          print('Updated runtime callers:', ', '.join(runtime_files))
          PY

          node --test test/auth-readiness-contract.test.mjs test/auth-runtime-schema-contract.test.mjs

          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move auth schema repair out of request paths'
          git push origin HEAD:fix/auth-runtime-schema-readiness-2026-09-01
