name: Repair Otya Core D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR-OTYA-CORE to run the additive schema repair'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repair-otya-core-d1
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and verify preserved Otya core D1
    if: ${{ inputs.confirm == 'REPAIR-OTYA-CORE' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-package-lock --ignore-scripts
      - name: Run additive D1 repair
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          bash scripts/repair-core-schema.sh
