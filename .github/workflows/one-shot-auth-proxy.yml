name: One-shot auth proxy repair

on:
  push:
    paths:
      - .github/workflows/one-shot-auth-proxy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire public auth routes to otya-auth service binding
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/queue-worker.mjs')
          s = p.read_text()
          old = "  fetch: openNextWorker.fetch.bind(openNextWorker),"
          new = """  async fetch(request, env, ctx) {
    const url = new URL(request.url)
    if (url.pathname === '/auth' || url.pathname.startsWith('/auth/')) {
      if (!env.AUTH?.fetch) {
        return new Response(JSON.stringify({ error: 'Authentication service unavailable' }), {
          status: 503,
          headers: { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store' },
        })
      }
      return env.AUTH.fetch(request)
    }
    return openNextWorker.fetch(request, env, ctx)
  },"""
          if old not in s:
            raise SystemExit('HTTP delegate marker not found')
          p.write_text(s.replace(old, new))
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'PeterSmart Link Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/queue-worker.mjs
          git commit -m 'Route app auth requests to otya-auth service'
          git push
