name: One-shot Space nullable account repair

on:
  push:
    branches: ['fix/space-nullable-account-2026-09-01']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/space-nullable-account-2026-09-01
          fetch-depth: 0
      - name: Make Space support provider-only accounts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" = "Support provider-only accounts in Space" ]; then
            echo 'Repair already applied.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/account/page.tsx')
          text = path.read_text()

          replacements = [
            ('  email: string\n', '  email: string | null\n'),
            ('    if (!next?.email) return\n', '    if (!next?.id) return\n'),
            ("          <div className=\"text-lg font-black break-words\">{user.name || user.email.split('@')[0]}</div>\n          <div className=\"mt-1 text-sm otya-muted break-words\">{user.email}</div>\n",
             "          <div className=\"text-lg font-black break-words\">{user.name || user.email?.split('@')[0] || user.otya_id || 'OTYA user'}</div>\n          <div className=\"mt-1 text-sm otya-muted break-words\">{user.email || 'No email added'}</div>\n"),
            ('        <ReadOnly label="Primary email" value={user.email} />\n',
             '        <ReadOnly label="Primary email" value={user.email || \'No email added\'} />\n'),
            ("      <Row title=\"Primary email\" detail={user.is_verified ? 'Verified' : 'Verification required'}>\n        {!user.is_verified && <div className=\"mt-3 flex flex-wrap gap-2\"><button onClick={() => void sendEmailCode()} disabled={busy} className=\"otya-quiet-button rounded-xl px-3 min-h-10 text-sm font-bold\">Send code</button><input value={emailCode} onChange={e => setEmailCode(e.target.value)} placeholder=\"A1234\" className=\"space-input max-w-[160px]\"/><button onClick={() => void verifyEmail()} disabled={busy} className=\"cosmos-button rounded-xl px-3 min-h-10 text-sm font-bold\">Verify</button></div>}\n      </Row>\n",
             "      <Row title=\"Primary email\" detail={!user.email ? 'No email added' : user.is_verified ? 'Verified' : 'Verification required'}>\n        {user.email && !user.is_verified && <div className=\"mt-3 flex flex-wrap gap-2\"><button onClick={() => void sendEmailCode()} disabled={busy} className=\"otya-quiet-button rounded-xl px-3 min-h-10 text-sm font-bold\">Send code</button><input value={emailCode} onChange={e => setEmailCode(e.target.value)} placeholder=\"A1234\" className=\"space-input max-w-[160px]\"/><button onClick={() => void verifyEmail()} disabled={busy} className=\"cosmos-button rounded-xl px-3 min-h-10 text-sm font-bold\">Verify</button></div>}\n        {!user.email && <p className=\"mt-3 text-sm otya-muted\">This account currently uses a connected identity such as Telegram. You can still use Otya Space and two-step verification without a primary email.</p>}\n      </Row>\n"),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected Space account source was not found: {old[:100]}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('test/account-nullable-identity-contract.test.mjs')
          test.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst page = readFileSync(new URL('../src/app/account/page.tsx', import.meta.url), 'utf8')\n\ntest('Otya Space accepts provider-only accounts with no email', () => {\n  assert.match(page, /email: string \\| null/)\n  assert.match(page, /if \\(!next\\?\\.id\\) return/)\n  assert.doesNotMatch(page, /if \\(!next\\?\\.email\\) return/)\n  assert.match(page, /user\\.email\\?\\.split/)\n  assert.match(page, /No email added/)\n  assert.match(page, /user\\.email && !user\\.is_verified/)\n  assert.doesNotMatch(page, /user\\.email\\.split/)\n})\n""")
          PY

          npm install --no-package-lock --ignore-scripts
          npm run typecheck
          node --test test/account-nullable-identity-contract.test.mjs
          npm test
          git diff --check

          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/account/page.tsx test/account-nullable-identity-contract.test.mjs
          git commit -m 'Support provider-only accounts in Space'
          git push origin HEAD:fix/space-nullable-account-2026-09-01
