name: Deploy OTYA to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  validate:
    name: Validate complete OTYA backend
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - name: Validate store/web
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run validate:config
          npm test
          npm run build
          npm run typecheck
      - name: Validate auth worker
        working-directory: auth-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npm test
          npx tsc --noEmit
      - name: Validate AI worker
        working-directory: ai-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npm test
          npm run check

  deploy-auth:
    name: Deploy otya-auth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - working-directory: auth-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Configure and deploy auth
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ secrets.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ secrets.TELEGRAM_LOGIN_CLIENT_SECRET }}
          TELEGRAM_GATEWAY_TOKEN: ${{ secrets.TELEGRAM_GATEWAY_TOKEN }}
          ACCOUNT_ENCRYPTION_KEY: ${{ secrets.ACCOUNT_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" && test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          if [ -n "${FIREBASE_API_KEY:-}" ]; then
            printf '%s' "$FIREBASE_API_KEY" | npx wrangler secret put FIREBASE_API_KEY
          fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_ID:-}" ]; then
            printf '%s' "$TELEGRAM_LOGIN_CLIENT_ID" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_ID
          fi
          if [ -n "${TELEGRAM_LOGIN_CLIENT_SECRET:-}" ]; then
            printf '%s' "$TELEGRAM_LOGIN_CLIENT_SECRET" | npx wrangler secret put TELEGRAM_LOGIN_CLIENT_SECRET
          fi
          if [ -n "${TELEGRAM_GATEWAY_TOKEN:-}" ]; then
            printf '%s' "$TELEGRAM_GATEWAY_TOKEN" | npx wrangler secret put TELEGRAM_GATEWAY_TOKEN
          fi
          if [ -n "${ACCOUNT_ENCRYPTION_KEY:-}" ]; then
            printf '%s' "$ACCOUNT_ENCRYPTION_KEY" | npx wrangler secret put ACCOUNT_ENCRYPTION_KEY
          fi
          npx wrangler deploy

  deploy-store:
    name: Deploy otya-store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - run: npm install --no-package-lock --ignore-scripts
      - name: Build and deploy OTYA backend
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          npm run validate:config
          if [ -n "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON
          fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then
            printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET
          fi
          if [ -n "${ADMIN_EMAIL:-}" ]; then
            printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          fi
          if [ -n "${ADMIN_PASSWORD:-}" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          fi
          if [ -n "${ADMIN_SESSION_SECRET:-}" ]; then
            printf '%s' "$ADMIN_SESSION_SECRET" | npx wrangler secret put ADMIN_SESSION_SECRET
          fi
          if [ -n "${FIREBASE_APP_DISTRIBUTION_TESTERS:-}" ]; then
            printf '%s' "$FIREBASE_APP_DISTRIBUTION_TESTERS" | npx wrangler secret put FIREBASE_APP_DISTRIBUTION_TESTERS
          fi
          npm run deploy

  deploy-ai:
    name: Deploy otya-ai
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', package-manager-cache: false }
      - working-directory: ai-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Remove obsolete store AI queue consumer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler queues consumer remove otya-ai-queue otya-store || true
      - name: Configure and deploy AI
        working-directory: ai-worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          GMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.GMAIL_GOOGLE_CLIENT_SECRET }}
          CONNECTOR_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          fi
          if [ -n "${INTERNAL_SECRET:-}" ]; then
            printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          fi
          if [ -n "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          fi
          if [ -n "${GMAIL_GOOGLE_CLIENT_SECRET:-}" ]; then
            printf '%s' "$GMAIL_GOOGLE_CLIENT_SECRET" | npx wrangler secret put GMAIL_GOOGLE_CLIENT_SECRET
          fi
          if [ -n "${CONNECTOR_ENCRYPTION_KEY:-}" ]; then
            printf '%s' "$CONNECTOR_ENCRYPTION_KEY" | npx wrangler secret put CONNECTOR_ENCRYPTION_KEY
          fi
          npx wrangler deploy
