name: Deploy OTYA System to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  validate:
    name: Validate complete OTYA backend
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate store/web
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          npm run typecheck
      - name: Validate auth worker
        working-directory: auth-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npx tsc --noEmit
      - name: Validate AI worker
        working-directory: ai-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run check

  deploy-auth:
    name: Deploy otya-auth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: auth-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Configure and deploy auth
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" && test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          npx wrangler deploy

  # Deploy the public store first so its current trigger configuration is live
  # before the dedicated AI worker takes ownership of AI-only triggers.
  deploy-store:
    name: Deploy otya-store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-package-lock --ignore-scripts
      - name: Build and deploy main backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm run deploy

  deploy-ai:
    name: Deploy otya-ai
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: ai-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Remove obsolete store AI queue consumer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Wrangler does not automatically remove a previously-created Queue
          # consumer when its [[queues.consumers]] block disappears from another
          # Worker's config. Remove only the obsolete otya-store ownership.
          # A failure here is tolerated because the following otya-ai deploy is
          # authoritative and will fail if another conflicting consumer remains.
          npx wrangler queues consumer remove otya-ai-queue otya-store || true
      - name: Configure and deploy AI
        working-directory: ai-worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          # The AI support console uses the same service-to-service secret as
          # otya-store. Keep deployment compatible if the GitHub secret has not
          # been added yet; in that case the admin email routes stay locked.
          if [ -n "${INTERNAL_SECRET:-}" ]; then
            printf '%s' "$INTERNAL_SECRET" | npx wrangler secret put INTERNAL_SECRET
          fi
          npx wrangler deploy
