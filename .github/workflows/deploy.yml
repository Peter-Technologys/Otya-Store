name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The store repository currently has no package-lock.json, so npm ci
      # cannot be used yet. npm install is deterministic from package.json
      # until a lockfile is committed.
      - name: Install store dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate store build
        run: npm run build

      - name: Typecheck store/web application
        run: npm run typecheck

      - name: Install auth-worker dependencies
        run: npm ci
        working-directory: auth-worker

      - name: Typecheck auth-worker
        run: npx tsc --noEmit
        working-directory: auth-worker

  deploy-auth:
    name: Deploy Auth Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json

      - name: Install auth-worker dependencies
        run: npm ci
        working-directory: auth-worker

      - name: Deploy otya-auth worker
        run: npx wrangler deploy
        working-directory: auth-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-store:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-auth
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Build and deploy with OpenNext
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
