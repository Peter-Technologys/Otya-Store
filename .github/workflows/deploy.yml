name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install store dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Validate store build
        run: npm run build
      - name: Typecheck store/web application
        run: npm run typecheck
      - name: Install auth-worker dependencies
        run: npm install --no-package-lock --ignore-scripts
        working-directory: auth-worker
      - name: Typecheck auth-worker
        run: npx tsc --noEmit
        working-directory: auth-worker

  deploy-auth:
    name: Deploy Auth Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install auth-worker dependencies
        run: npm install --no-package-lock --ignore-scripts
        working-directory: auth-worker
      - name: Configure Auth Worker secrets
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" || { echo 'AUTH_JWT_SECRET GitHub secret is missing'; exit 1; }
          test -n "$RESEND_API_KEY" || { echo 'RESEND_API_KEY GitHub secret is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID GitHub secret is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN GitHub secret is missing'; exit 1; }
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - name: Deploy otya-auth worker
        working-directory: auth-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-store:
    name: Deploy Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-auth
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Build and deploy with OpenNext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          npm run deploy 2>&1 | tee /tmp/otya-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_status" -eq 0 ]; then exit 0; fi
          if ! grep -q 'need to enable Analytics Engine' /tmp/otya-deploy.log; then
            echo 'Cloudflare deployment failed for a reason unrelated to Analytics Engine.'
            exit "$deploy_status"
          fi
          echo '::warning title=Analytics Engine disabled::Retrying without only the OTYA_ANALYTICS binding.'
          python3 - <<'PYEOF'
          from pathlib import Path
          path = Path('wrangler.toml')
          lines = path.read_text().splitlines()
          output = []
          skipping = False
          for line in lines:
              if line.strip() == '[[analytics_engine_datasets]]':
                  skipping = True
                  continue
              if skipping and line.startswith('['): skipping = False
              if not skipping: output.append(line)
          path.write_text('\n'.join(output).rstrip() + '\n')
          PYEOF
          npx opennextjs-cloudflare deploy
