name: Deploy OTYA System to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  validate:
    name: Validate complete OTYA backend
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate store/web
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          npm run typecheck
      - name: Validate auth worker
        working-directory: auth-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npx tsc --noEmit
      - name: Validate AI worker
        working-directory: ai-worker
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run check

  deploy-auth:
    name: Deploy otya-auth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: auth-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Configure and deploy auth
        working-directory: auth-worker
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AUTH_JWT_SECRET" && test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          npx wrangler deploy

  # otya-store must deploy before otya-ai while moving AI ownership. This
  # releases the old AI cron schedules and otya-ai-queue consumer first, which
  # avoids the Workers Free cron limit and duplicate queue-consumer errors.
  deploy-store:
    name: Deploy otya-store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-package-lock --ignore-scripts
      - name: Build and deploy main backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          npm run deploy 2>&1 | tee /tmp/otya-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if ! grep -q 'need to enable Analytics Engine' /tmp/otya-deploy.log; then exit "$status"; fi
          python3 - <<'PYEOF'
          from pathlib import Path
          p=Path('wrangler.toml'); lines=p.read_text().splitlines(); out=[]; skip=False
          for line in lines:
              if line.strip()=='[[analytics_engine_datasets]]': skip=True; continue
              if skip and line.startswith('['): skip=False
              if not skip: out.append(line)
          p.write_text('\n'.join(out).rstrip()+'\n')
          PYEOF
          npx opennextjs-cloudflare deploy

  deploy-ai:
    name: Deploy otya-ai
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: ai-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Configure and deploy AI
        working-directory: ai-worker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RESEND_API_KEY" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          npx wrangler deploy
