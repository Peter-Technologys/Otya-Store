name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline-security:
    name: Private repository security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block tracked secret/signing files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|key\.properties$|keystore\.jks$|.*\.(jks|keystore|p12|pfx|pem|key)$)'
          if git ls-files | grep -E "$forbidden"; then
            echo '::error::Potential secret/signing material is tracked by Git.'
            exit 1
          fi
      - name: Block private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '^-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$' -- ':!*.md'; then
            echo '::error::Private-key material detected in tracked source.'
            exit 1
          fi
      - name: Validate backend dependency install and typecheck
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run typecheck
      - name: Validate auth-worker dependency install
        run: npm install --no-package-lock --ignore-scripts
        working-directory: auth-worker
      - name: Typecheck auth-worker
        run: npx tsc --noEmit
        working-directory: auth-worker

  dependency-review:
    name: Dependency review (GHAS)
    if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL JavaScript/TypeScript (GHAS)
    if: github.event_name != 'pull_request' && vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Install auth-worker dependencies
        run: npm install --no-package-lock --ignore-scripts
        working-directory: auth-worker
      - name: Build backend
        run: npm run build
      - name: Analyze
        uses: github/codeql-action/analyze@v3
