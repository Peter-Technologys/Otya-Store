name: One-shot canonical Telegram Space repair

on:
  push:
    branches: ['fix/telegram-space-canonical-2026-09-01']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/telegram-space-canonical-2026-09-01
          fetch-depth: 0
      - name: Canonicalize Telegram Mini App runtime URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          replacements = {
            Path('src/lib/telegram-bot.mjs'): [
              ("const MINI_APP_URL = 'https://space.petersmartlink.com/telegram'", "const MINI_APP_URL = 'https://space.petersmartlink.com/telegram/'"),
            ],
            Path('auth-worker/src/telegram-miniapp.ts'): [
              ("account_url: 'https://space.petersmartlink.com/telegram?complete=account'", "account_url: 'https://space.petersmartlink.com/telegram/?complete=account'"),
            ],
          }
          for path, pairs in replacements.items():
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'expected text missing in {path}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY

          node --test test/telegram-package-contract.test.mjs
          grep -F "const MINI_APP_URL = 'https://space.petersmartlink.com/telegram/'" src/lib/telegram-bot.mjs
          grep -F "https://space.petersmartlink.com/telegram/?complete=account" auth-worker/src/telegram-miniapp.ts

          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/telegram-bot.mjs auth-worker/src/telegram-miniapp.ts
          git commit -m 'Use canonical Telegram Space runtime URL'
          git push origin HEAD:fix/telegram-space-canonical-2026-09-01
