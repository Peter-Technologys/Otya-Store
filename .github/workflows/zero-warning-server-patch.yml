name: One-shot server zero-warning cleanup

on:
  push:
    branches: [v1-rebuild]
    paths:
      - '.github/workflows/zero-warning-server-patch.yml'

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v5
        with:
          ref: v1-rebuild
          fetch-depth: 0
      - name: Apply exact source and workflow patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          account = 'src/app/account/page.tsx'
          rep(account,
              "import { FormEvent, ReactNode, useEffect, useState } from 'react'\nimport Link from 'next/link'",
              "import { FormEvent, ReactNode, useCallback, useEffect, useState } from 'react'\nimport Image from 'next/image'\nimport Link from 'next/link'")
          rep(account,
              "type Json = Record<string, any>",
              "type Json = Record<string, unknown>\n\nfunction jsonText(value: unknown): string {\n  return typeof value === 'string' ? value : ''\n}")

          old_block = '''  useEffect(() => {\n    setLocale(navigator.language || '')\n    setTimezone(Intl.DateTimeFormat().resolvedOptions().timeZone || '')\n    void restoreSession()\n  }, [])\n\n  async function restoreSession() {\n    setCheckingSession(true)\n    try {\n      const response = await accountFetch('session')\n      const data = await response.json().catch(() => ({})) as Json\n      if (!response.ok || data.authenticated !== true) {\n        setAuthenticated(false)\n        setUser(null)\n        return\n      }\n      setAuthenticated(true)\n      hydrateAccount(data)\n      await refreshSecondary()\n    } catch {\n      setAuthenticated(false)\n    } finally {\n      setCheckingSession(false)\n    }\n  }\n\n  function hydrateAccount(data: Json) {\n    const nextUser = data.user as User | undefined\n    if (!nextUser) return\n    setUser(nextUser)\n    setIdentities(Array.isArray(data.identities) ? data.identities : [])\n    setEditName(nextUser.name || '')\n    setRecoveryEmail(nextUser.recovery_email || '')\n    setCountry(nextUser.country_code || '')\n    setLocale(nextUser.locale || navigator.language || '')\n    setTimezone(nextUser.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone || '')\n    setPhone(nextUser.phone_number || '')\n  }\n\n  async function refreshSecondary() {\n    await Promise.all([loadTwoFactor(), loadSessions(), loadConsent()])\n  }'''
          new_block = '''  const loadTwoFactor = useCallback(async () => {\n    try {\n      const response = await accountFetch('2fa/status')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setTwoFactor(data as unknown as TwoFactorStatus)\n    } catch {}\n  }, [])\n\n  const loadSessions = useCallback(async () => {\n    try {\n      const response = await accountFetch('sessions')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setSessions(Array.isArray(data.sessions) ? data.sessions as Session[] : [])\n    } catch {}\n  }, [])\n\n  const loadConsent = useCallback(async () => {\n    try {\n      const response = await accountFetch('consent')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setConsent((data.consent || null) as Consent | null)\n    } catch {}\n  }, [])\n\n  const hydrateAccount = useCallback((data: Json) => {\n    const nextUser = data.user as User | undefined\n    if (!nextUser) return\n    setUser(nextUser)\n    setIdentities(Array.isArray(data.identities) ? data.identities as Identity[] : [])\n    setEditName(nextUser.name || '')\n    setRecoveryEmail(nextUser.recovery_email || '')\n    setCountry(nextUser.country_code || '')\n    setLocale(nextUser.locale || navigator.language || '')\n    setTimezone(nextUser.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone || '')\n    setPhone(nextUser.phone_number || '')\n  }, [])\n\n  const refreshSecondary = useCallback(async () => {\n    await Promise.all([loadTwoFactor(), loadSessions(), loadConsent()])\n  }, [loadConsent, loadSessions, loadTwoFactor])\n\n  const restoreSession = useCallback(async () => {\n    setCheckingSession(true)\n    try {\n      const response = await accountFetch('session')\n      const data = await response.json().catch(() => ({})) as Json\n      if (!response.ok || data.authenticated !== true) {\n        setAuthenticated(false)\n        setUser(null)\n        return\n      }\n      setAuthenticated(true)\n      hydrateAccount(data)\n      await refreshSecondary()\n    } catch {\n      setAuthenticated(false)\n    } finally {\n      setCheckingSession(false)\n    }\n  }, [hydrateAccount, refreshSecondary])\n\n  useEffect(() => {\n    setLocale(navigator.language || '')\n    setTimezone(Intl.DateTimeFormat().resolvedOptions().timeZone || '')\n    void restoreSession()\n  }, [restoreSession])'''
          rep(account, old_block, new_block)

          for old in [
              '''  async function loadTwoFactor() {\n    try {\n      const response = await accountFetch('2fa/status')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setTwoFactor(data as unknown as TwoFactorStatus)\n    } catch {}\n  }\n\n''',
              '''  async function loadSessions() {\n    try {\n      const response = await accountFetch('sessions')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setSessions(Array.isArray(data.sessions) ? data.sessions : [])\n    } catch {}\n  }\n\n''',
              '''  async function loadConsent() {\n    try {\n      const response = await accountFetch('consent')\n      const data = await response.json().catch(() => ({})) as Json\n      if (response.ok) setConsent((data.consent || null) as Consent | null)\n    } catch {}\n  }\n\n'''
          ]:
              rep(account, old, '')

          p = Path(account)
          text = p.read_text()
          text = text.replace('data.error ||', 'jsonText(data.error) ||')
          text = text.replace('return data.message ||', 'return jsonText(data.message) ||')
          p.write_text(text)
          rep(account,
              '<img src="/web-app-manifest-192x192.png" alt="OTYA" className="w-12 h-12 rounded-2xl" />',
              '<Image src="/web-app-manifest-192x192.png" alt="OTYA" width={48} height={48} className="w-12 h-12 rounded-2xl" priority />')

          admin = 'src/app/admin/page.tsx'
          rep(admin,
              "import { FormEvent, useCallback, useEffect, useMemo, useState } from 'react'",
              "import { FormEvent, useCallback, useEffect, useMemo, useState } from 'react'\nimport Image from 'next/image'")
          rep(admin,
              '<img src="/android-chrome-192x192.png" alt="OTYA" className="h-full w-full object-cover" />',
              '<Image src="/android-chrome-192x192.png" alt="OTYA" width={64} height={64} className="h-full w-full object-cover" priority />')
          rep(admin,
              '<img src="/android-chrome-192x192.png" alt="OTYA" className="h-9 w-9 rounded-xl" />',
              '<Image src="/android-chrome-192x192.png" alt="OTYA" width={36} height={36} className="h-9 w-9 rounded-xl" />')

          for workflow in ['.github/workflows/deploy.yml', '.github/workflows/security.yml']:
              p = Path(workflow)
              text = p.read_text().replace('actions/checkout@v4', 'actions/checkout@v5').replace('actions/setup-node@v4', 'actions/setup-node@v5')
              p.write_text(text)
          PY
      - name: Upgrade supported lint toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev eslint@^9 @typescript-eslint/eslint-plugin@^8 @typescript-eslint/parser@^8 --ignore-scripts --no-audit --no-fund
      - name: Validate patched server
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:config
          npm test
          npm run typecheck
          npx eslint src --max-warnings=0
          npm run build
          npm audit --audit-level=moderate
          cd auth-worker
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npm audit --audit-level=moderate
          cd ../ai-worker
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run check
          npm audit --audit-level=moderate
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zero-warning-server-patch.yml
          git config user.name 'OTYA CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/account/page.tsx src/app/admin/page.tsx .github/workflows/deploy.yml .github/workflows/security.yml package.json package-lock.json auth-worker/package-lock.json ai-worker/package-lock.json || true
          git diff --cached --check
          git commit -m 'fix: enforce warning-clean server validation'
          git push origin HEAD:v1-rebuild
