name: Sync Telegram Auth Credential

on:
  push:
    branches: [main]
    paths:
      - 'auth-worker/**'
      - 'src/app/telegram-login/**'
      - 'src/app/api/auth/telegram/**'
      - '.github/workflows/telegram-auth-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-auth-secret-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Telegram bot token to otya-auth
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - working-directory: auth-worker
        run: npm install --no-package-lock --ignore-scripts
      - name: Install Telegram verification credential
        working-directory: auth-worker
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
