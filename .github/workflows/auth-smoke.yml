name: Otya Auth Smoke

on:
  push:
    branches: [design/otya-web-professional-20260830]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live website and Google CSP
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -fsSIL --max-time 20 https://petersmartlink.com/sign-in)"
          printf '%s\n' "$headers"
          csp="$(printf '%s\n' "$headers" | grep -i '^content-security-policy:' | tail -n1)"
          test -n "$csp"
          script_src="$(printf '%s' "$csp" | sed -n "s/.*script-src \([^;]*\).*/\1/p")"
          connect_src="$(printf '%s' "$csp" | sed -n "s/.*connect-src \([^;]*\).*/\1/p")"
          printf 'script-src: %s\nconnect-src: %s\n' "$script_src" "$connect_src"
          printf '%s' "$script_src" | grep -F 'https://accounts.google.com' >/dev/null
          printf '%s' "$connect_src" | grep -F 'https://accounts.google.com' >/dev/null

      - name: Check browser account session route
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://petersmartlink.com/api/account-session/session)"
          printf '%s\n' "$body"
          printf '%s\n' "$body" | grep -E '"authenticated"|"error"' >/dev/null

      - name: Report Telegram configuration
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' -X POST -H 'Accept: application/json' 'https://petersmartlink.com/api/auth/telegram/start?mode=login')"
          cat "$response"
          echo
          echo "HTTP $status"
          if [ "$status" = "200" ] && grep -q 'authorization_url' "$response"; then
            echo 'Telegram configured'
          else
            echo 'Telegram unavailable; sign-in UI must not present it as working.'
          fi
