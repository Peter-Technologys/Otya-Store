name: OTYA Auth Smoke

on:
  push:
    branches: [main]
    paths:
      - 'auth-worker/**'
      - 'src/app/sign-in/**'
      - 'src/app/account/**'
      - 'src/app/admin/**'
      - 'src/app/telegram-login/**'
      - 'src/app/api/auth/**'
      - 'next.config.mjs'
      - 'public/_headers'
      - '.github/workflows/auth-smoke.yml'
      - '.github/workflows/telegram-auth-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live sign-in CSP
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -fsSIL --max-time 20 https://petersmartlink.com/sign-in)"
          printf '%s\n' "$headers"
          csp="$(printf '%s\n' "$headers" | grep -i '^content-security-policy:' | tail -n1)"
          test -n "$csp"
          script_src="$(printf '%s' "$csp" | sed -n "s/.*script-src \([^;]*\).*/\1/p")"
          connect_src="$(printf '%s' "$csp" | sed -n "s/.*connect-src \([^;]*\).*/\1/p")"
          frame_src="$(printf '%s' "$csp" | sed -n "s/.*frame-src \([^;]*\).*/\1/p")"
          printf 'script-src: %s\nconnect-src: %s\nframe-src: %s\n' "$script_src" "$connect_src" "$frame_src"
          printf '%s' "$script_src" | grep -F 'https://accounts.google.com' >/dev/null
          printf '%s' "$script_src" | grep -F 'https://telegram.org' >/dev/null
          printf '%s' "$connect_src" | grep -F 'https://accounts.google.com' >/dev/null
          printf '%s' "$connect_src" | grep -F 'https://oauth.telegram.org' >/dev/null
          printf '%s' "$frame_src" | grep -F 'https://oauth.telegram.org' >/dev/null

      - name: Check browser account session route
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://petersmartlink.com/api/account-session/session)"
          printf '%s\n' "$body"
          printf '%s\n' "$body" | grep -E '"authenticated"|"error"' >/dev/null

      - name: Require Telegram Sign-In provider
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' -X POST -H 'Accept: application/json' 'https://petersmartlink.com/api/auth/telegram/start?mode=login')"
          cat "$response"
          echo
          echo "HTTP $status"
          test "$status" = "200"
          grep -q 'authorization_url' "$response"

      - name: Check Telegram handoff page
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://petersmartlink.com/telegram-login/)"
          test "$status" = "200"
