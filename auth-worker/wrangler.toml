name = "otya-auth"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding       = "AUTH_DB"
database_name = "otya-auth-db"
database_id   = "ab157fc6-2cbb-4d46-9789-2e4392e16aea"

[[kv_namespaces]]
binding = "AUTH_KV"
id      = "6b9faff751724fdb86c16452b9c99cf6"

# EMAIL binding — add via Cloudflare Dashboard:
#   Workers & Pages → otya-auth → Settings → Bindings → Add binding → Send Email
[[send_email]]
name                = "EMAIL"
destination_address = "petersmartlink@gmail.com"

[[r2_buckets]]
binding     = "GR_RECEIPTS"
bucket_name = "gr-app-receipts"

[vars]
CORS_ORIGIN = "https://petersmartlink.com"

# Secrets — set via:
#   wrangler secret put AUTH_JWT_SECRET
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put OTYA_STORE_INTERNAL_URL   (e.g. https://petersmartlink.com)
#   wrangler secret put INTERNAL_SECRET           (shared secret for /internal/delete-user)
