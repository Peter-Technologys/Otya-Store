# OTYA AUTH WORKER - User Authentication & Device Registration
# Database for: users, auth tokens, device info, playlists
# FIX: SEPARATE database from main store

name = "otya-auth-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
route = "auth.otyaplayer.com/*"
zone_id = "YOUR_CLOUDFLARE_ZONE_ID"

# Bindings

# KV - Auth tokens, user sessions
[[kv_namespaces]]
binding = "KV"
id = "YOUR_AUTH_KV_NAMESPACE_ID"

# D1 Database - User data ONLY (NOT analytics!)
# FIX: Use DIFFERENT database ID from store DB
[[d1_databases]]
binding = "AUTH_DB"
database_name = "otya-auth-db-production"
database_id = "YOUR-UNIQUE-AUTH-DB-ID"  # MUST DIFFER from otya-store DB ID

# Email Service - Send OTP codes
[[send_email]]
name = "EMAIL"

# Environment variables
[env.production.vars]
JWT_SECRET = "USE_CLOUDFLARE_SECRETS"
OTP_EXPIRY_MINUTES = "10"
