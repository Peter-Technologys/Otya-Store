name = "otya-auth"
main = "src/entrypoint.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding       = "AUTH_DB"
database_name = "otya-auth-db"
# Confirmed live production D1 binding. Do not replace without Cloudflare audit.
database_id   = "b05595f6-260a-4720-acca-4f8b13f5c43e"

[[kv_namespaces]]
binding = "AUTH_KV"
id      = "6b9faff751724fdb86c16452b9c99cf6"

[vars]
CORS_ORIGIN = "https://petersmartlink.com"
GOOGLE_CLIENT_ID = "82776565585-77b1t8epvmn3mpdvstdg1rtprlju4suv.apps.googleusercontent.com"

# Secrets are configured through GitHub Actions / Cloudflare, never committed.
# keep_vars=true preserves live optional secrets/vars such as internal service
# configuration when Wrangler deploys this Worker.
# Required: AUTH_JWT_SECRET, RESEND_API_KEY
# Optional live settings preserved by keep_vars: OTYA_STORE_INTERNAL_URL, INTERNAL_SECRET
