name = "otya-auth"
main = "src/index.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding       = "AUTH_DB"
database_name = "otya-auth-db"
# TODO: Replace this database_id with the actual otya-auth-db ID.
# Confirm the live Cloudflare binding before changing this value.
database_id   = "b05595f6-260a-4720-acca-4f8b13f5c43e"

[[kv_namespaces]]
binding = "AUTH_KV"
id      = "6b9faff751724fdb86c16452b9c99cf6"

# Legacy EMAIL binding is intentionally retained during the Resend migration.
# Remove it only after all email call sites use sendResendEmail() and the
# deployed Worker has passed verification, password-reset, welcome, and
# security-alert email tests.
[[send_email]]
name                = "EMAIL"
destination_address = "petersmartlink@gmail.com"

[vars]
CORS_ORIGIN = "https://petersmartlink.com"

# Required server-side secrets. Values must be configured in Cloudflare and
# local development secret files; never commit their values.
[secrets]
required = ["AUTH_JWT_SECRET", "RESEND_API_KEY"]

# Additional optional secrets used by the auth service:
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put OTYA_STORE_INTERNAL_URL
#   wrangler secret put INTERNAL_SECRET
